version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: einstein_postgres
    environment:
      POSTGRES_DB: einstein_db
      POSTGRES_USER: einstein_user
      POSTGRES_PASSWORD: einstein_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    networks:
      - einstein_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: einstein_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - einstein_network

  # FastAPI Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: einstein_backend
    environment:
      - DATABASE_URL=postgresql://einstein_user:einstein_password@postgres:5432/einstein_db
      - REDIS_URL=redis://redis:6379
      - SECRET_KEY=development_secret_key_change_in_production
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - backend_logs:/app/logs
    depends_on:
      - postgres
      - redis
    networks:
      - einstein_network
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  # Next.js Frontend
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: einstein_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000/ws
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    depends_on:
      - backend
    networks:
      - einstein_network
    command: npm run dev

  # Celery Worker (for background tasks)
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: einstein_celery_worker
    environment:
      - DATABASE_URL=postgresql://einstein_user:einstein_password@postgres:5432/einstein_db
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - einstein_network
    command: celery -A app.worker worker --loglevel=info

  # Celery Beat (for scheduled tasks)
  celery_beat:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: einstein_celery_beat
    environment:
      - DATABASE_URL=postgresql://einstein_user:einstein_password@postgres:5432/einstein_db
      - REDIS_URL=redis://redis:6379
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
    volumes:
      - ./backend:/app
    depends_on:
      - postgres
      - redis
    networks:
      - einstein_network
    command: celery -A app.worker beat --loglevel=info

networks:
  einstein_network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  backend_logs:
